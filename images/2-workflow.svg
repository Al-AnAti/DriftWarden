  <path d="M1560,650 L1560,860 L310,860 L310,724" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mfb7185)" filter="url(#gfb71858)" />
