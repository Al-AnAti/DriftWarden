  <text x="920" y="565" font-family="Inter, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8" font-weight="700" text-anchor="middle" opacity="0.9"><tspan fill="#34d399">MATCHED</tspan> · <tspan fill="#fbbf24">DRIFTED</tspan> · <tspan fill="#22d3ee">MISSING</tspan> · <tspan fill="#fb7185">ROGUE</tspan></text>
