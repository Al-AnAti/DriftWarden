<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">DriftWarden in four steps: a manual change, the event captured, the operator decides, the host is back in sync</title>
<defs></defs>
<rect width="100%" height="100%" fill="#0b1120"/>
<text x="800.0" y="54" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#e2e8f0"><tspan fill="#818cf8">Drift</tspan>Warden <tspan font-weight="600" fill="#e2e8f0">in four steps</tspan></text>
<text x="800.0" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="middle">From a manual change on the host to a reviewed baseline, in seconds, with nothing destructive happening on its own</text>
<path d="M230,200 L1370,200" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
<rect x="196" y="104" width="68" height="50" rx="8" fill="rgba(19,78,74,0.55)" stroke="#14b8a6" stroke-width="2"/>
<text x="208" y="138" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="22" fill="#5eead4" font-weight="800" text-anchor="start">&gt;_</text>
<circle cx="230" cy="200" r="26" fill="#0b1120" stroke="#14b8a6" stroke-width="4"/>
<text x="230" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#5eead4" font-weight="800" text-anchor="middle">1</text>
<text x="230" y="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#5eead4" font-weight="800" text-anchor="middle">Manual change on the host</text>
<text x="230" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">docker run with no labels, a hot-edited image or port,</text>
<text x="230" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">a service removed by hand: the host now disagrees</text>
<text x="230" y="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">with docker-compose.yaml in Git.</text>
<circle cx="610" cy="130" r="30" fill="rgba(124,45,18,0.55)" stroke="#f97316" stroke-width="2"/>
<polygon points="616,110 600,133 611,133 604,150 620,127 609,127" fill="#fdba74"/>
<circle cx="610" cy="200" r="26" fill="#0b1120" stroke="#f97316" stroke-width="4"/>
<text x="610" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#fdba74" font-weight="800" text-anchor="middle">2</text>
<text x="610" y="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#fdba74" font-weight="800" text-anchor="middle">Event captured</text>
<text x="610" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">The Docker socket emits the event; after a 2 s quiet</text>
<text x="610" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">window the reconciler classifies every container as</text>
<text x="610" y="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">ROGUE, DRIFTED or MISSING. Dashboard repaints over</text>
<text x="610" y="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">SSE, the status pill turns, a chime plays.</text>
<circle cx="974" cy="114" r="7" fill="none" stroke="#c7d2fe" stroke-width="3"/>
<circle cx="974" cy="148" r="7" fill="none" stroke="#c7d2fe" stroke-width="3"/>
<circle cx="1008" cy="148" r="7" fill="none" stroke="#c7d2fe" stroke-width="3"/>
<path d="M974,121 L974,141" fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M986,114 L998,114 Q1008,114 1008,124 L1008,141" fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="990" cy="200" r="26" fill="#0b1120" stroke="#818cf8" stroke-width="4"/>
<text x="990" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#c7d2fe" font-weight="800" text-anchor="middle">3</text>
<text x="990" y="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#c7d2fe" font-weight="800" text-anchor="middle">Operator decides</text>
<text x="990" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">Enforce: the host is recreated or cleaned to match Git.</text>
<text x="990" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">Adopt: the container is reverse-engineered into YAML</text>
<text x="990" y="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">and a pull request opens; the entry waits in the buffer.</text>
<text x="990" y="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">Whitelist: exempt it. Nothing happens without a click.</text>
<path d="M1370,100 L1396,110 L1394,136 Q1390,154 1370,162 Q1350,154 1346,136 L1344,110 Z" fill="rgba(6,78,59,0.55)" stroke="#10b981" stroke-width="2"/>
<path d="M1358,130 L1367,140 L1384,120" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1370" cy="200" r="26" fill="#0b1120" stroke="#10b981" stroke-width="4"/>
<text x="1370" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#6ee7b7" font-weight="800" text-anchor="middle">4</text>
<text x="1370" y="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#6ee7b7" font-weight="800" text-anchor="middle">Back in sync</text>
<text x="1370" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">The PR is merged and the baseline re-fetched, or the</text>
<text x="1370" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">Enforce action lands: every row is MATCHED, the pill</text>
<text x="1370" y="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">says IN SYNC, and the audit log in SQLite has one row</text>
<text x="1370" y="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">for every detection and action.</text>
<rect x="512.145" y="400" width="50.45" height="22" rx="11.0" fill="rgba(136,19,55,0.55)" stroke="#f43f5e" stroke-width="1.2"/>
<text x="537.37" y="414.78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#fda4af" font-weight="700" text-anchor="middle" letter-spacing="0.4">ROGUE</text>
<rect x="572.595" y="400" width="62.629999999999995" height="22" rx="11.0" fill="rgba(120,53,15,0.55)" stroke="#f59e0b" stroke-width="1.2"/>
<text x="603.9100000000001" y="414.78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#fcd34d" font-weight="700" text-anchor="middle" letter-spacing="0.4">DRIFTED</text>
<rect x="645.225" y="400" width="62.629999999999995" height="22" rx="11.0" fill="rgba(12,74,110,0.55)" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="676.54" y="414.78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7dd3fc" font-weight="700" text-anchor="middle" letter-spacing="0.4">MISSING</text>
<rect x="886.0550000000001" y="400" width="62.629999999999995" height="22" rx="11.0" fill="rgba(136,19,55,0.55)" stroke="#f43f5e" stroke-width="1.2"/>
<text x="917.3700000000001" y="414.78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#fda4af" font-weight="700" text-anchor="middle" letter-spacing="0.4">Enforce</text>
<rect x="958.6850000000001" y="400" width="50.45" height="22" rx="11.0" fill="rgba(6,78,59,0.55)" stroke="#10b981" stroke-width="1.2"/>
<text x="983.9100000000001" y="414.78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6ee7b7" font-weight="700" text-anchor="middle" letter-spacing="0.4">Adopt</text>
<rect x="1019.1350000000001" y="400" width="74.81" height="22" rx="11.0" fill="rgba(30,41,59,0.8)" stroke="#64748b" stroke-width="1.2"/>
<text x="1056.5400000000002" y="414.78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#cbd5e1" font-weight="700" text-anchor="middle" letter-spacing="0.4">Whitelist</text>
<rect x="1302.37" y="400" width="62.629999999999995" height="22" rx="11.0" fill="rgba(6,78,59,0.55)" stroke="#10b981" stroke-width="1.2"/>
<text x="1333.685" y="414.78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6ee7b7" font-weight="700" text-anchor="middle" letter-spacing="0.4">MATCHED</text>
<rect x="1375.0" y="400" width="62.629999999999995" height="22" rx="11.0" fill="rgba(6,78,59,0.55)" stroke="#10b981" stroke-width="1.2"/>
<text x="1406.315" y="414.78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6ee7b7" font-weight="700" text-anchor="middle" letter-spacing="0.4">IN SYNC</text>
<rect x="60" y="470" width="1480" height="110" rx="12" fill="#111a2e" stroke="#263247" stroke-width="1.5"/>
<text x="80" y="500" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="start">Try it</text>
<text x="80" y="526" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">make demo-up starts the fixture stack (web + cache, both MATCHED). make demo-drift runs an unlabelled memcached, deletes web and recreates cache with the wrong port and labels:</text>
<text x="80" y="544" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">one ROGUE, one MISSING, one DRIFTED, pill DRIFT DETECTED. Enforce or Adopt each row from the dashboard; after an Adopt PR merges, the memcached shows AWAITING RESTART until</text>
<text x="80" y="562" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">docker compose up (or Enforce) recreates it with labels. make demo-down tears everything down.</text>
<text x="1572" y="620" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="400" text-anchor="end">docs/overview.md · section 6, scripts/demo.sh</text>
</svg>
