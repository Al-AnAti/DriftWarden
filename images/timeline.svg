<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t">
<title id="t">DriftWarden in four steps: a manual change on the host, the event captured, the operator decides, the host is back in sync</title>
<defs><filter id="g22d3ee16" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#22d3ee" flood-opacity="0.75"/></filter><filter id="g22d3ee8" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22d3ee" flood-opacity="0.6"/></filter><filter id="g34d39916" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#34d399" flood-opacity="0.75"/></filter><filter id="g34d3998" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#34d399" flood-opacity="0.6"/></filter><filter id="g94a3b88" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.6"/></filter><filter id="ga78bfa16" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#a78bfa" flood-opacity="0.75"/></filter><filter id="ga78bfa8" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a78bfa" flood-opacity="0.6"/></filter><filter id="gfb71858" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fb7185" flood-opacity="0.6"/></filter><filter id="gfb923c16" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#fb923c" flood-opacity="0.75"/></filter><filter id="gfbbf248" filterUnits="userSpaceOnUse" x="-100" y="-100" width="2120" height="1280"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.6"/></filter></defs>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="60" y="43.68" width="10" height="39.6" rx="5" fill="#22d3ee" stroke="none" stroke-width="3" filter="url(#g22d3ee8)"/>
<text x="90" y="78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" fill="#f8fafc" font-weight="800" text-anchor="start">From a manual change to a host back in sync</text>
<path d="M300,420 L1620,420" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="300" cy="420" r="58" fill="#0f172a" stroke="#fb923c" stroke-width="6" filter="url(#gfb923c16)"/>
<text x="300" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" fill="#fb923c" font-weight="800" text-anchor="middle">1</text>
<text x="300" y="565" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" fill="#fb923c" font-weight="800" text-anchor="middle">Manual change</text>
<text x="300" y="618" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">docker run with no labels,</text>
<text x="300" y="654" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">an image or port edited by hand,</text>
<text x="300" y="690" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">a service removed from the host</text>
<circle cx="740" cy="420" r="58" fill="#0f172a" stroke="#22d3ee" stroke-width="6" filter="url(#g22d3ee16)"/>
<text x="740" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" fill="#22d3ee" font-weight="800" text-anchor="middle">2</text>
<text x="740" y="565" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" fill="#22d3ee" font-weight="800" text-anchor="middle">Event captured</text>
<text x="740" y="618" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">the Docker socket emits the event,</text>
<text x="740" y="654" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">a 2 s quiet window, then every</text>
<text x="740" y="690" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">container is classified against Git</text>
<circle cx="1180" cy="420" r="58" fill="#0f172a" stroke="#a78bfa" stroke-width="6" filter="url(#ga78bfa16)"/>
<text x="1180" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" fill="#a78bfa" font-weight="800" text-anchor="middle">3</text>
<text x="1180" y="565" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" fill="#a78bfa" font-weight="800" text-anchor="middle">Operator decides</text>
<text x="1180" y="618" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">the dashboard repaints live over SSE;</text>
<text x="1180" y="654" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">Enforce fixes the host, Adopt opens</text>
<text x="1180" y="690" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">a pull request, Whitelist exempts it</text>
<circle cx="1620" cy="420" r="58" fill="#0f172a" stroke="#34d399" stroke-width="6" filter="url(#g34d39916)"/>
<text x="1620" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" fill="#34d399" font-weight="800" text-anchor="middle">4</text>
<text x="1620" y="565" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" fill="#34d399" font-weight="800" text-anchor="middle">Back in sync</text>
<text x="1620" y="618" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">the PR merges and the baseline is</text>
<text x="1620" y="654" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">re-fetched, or Enforce lands: every</text>
<text x="1620" y="690" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="600" text-anchor="middle">row MATCHED, one audit row per action</text>
<rect x="556.4" y="779.0" width="96.8" height="42" rx="21.0" fill="rgba(251,113,133,0.14)" stroke="#fb7185" stroke-width="2.5" filter="url(#gfb71858)"/>
<text x="604.8" y="807.92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#fb7185" font-weight="800" text-anchor="middle" letter-spacing="0.5">ROGUE</text>
<rect x="665.1999999999999" y="779.0" width="123.19999999999999" height="42" rx="21.0" fill="rgba(251,191,36,0.14)" stroke="#fbbf24" stroke-width="2.5" filter="url(#gfbbf248)"/>
<text x="726.8" y="807.92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#fbbf24" font-weight="800" text-anchor="middle" letter-spacing="0.5">DRIFTED</text>
<rect x="800.3999999999999" y="779.0" width="123.19999999999999" height="42" rx="21.0" fill="rgba(34,211,238,0.14)" stroke="#22d3ee" stroke-width="2.5" filter="url(#g22d3ee8)"/>
<text x="861.9999999999999" y="807.92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#22d3ee" font-weight="800" text-anchor="middle" letter-spacing="0.5">MISSING</text>
<rect x="983.1999999999999" y="779.0" width="123.19999999999999" height="42" rx="21.0" fill="rgba(52,211,153,0.14)" stroke="#34d399" stroke-width="2.5" filter="url(#g34d3998)"/>
<text x="1044.8" y="807.92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#34d399" font-weight="800" text-anchor="middle" letter-spacing="0.5">Enforce</text>
<rect x="1118.4" y="779.0" width="96.8" height="42" rx="21.0" fill="rgba(167,139,250,0.14)" stroke="#a78bfa" stroke-width="2.5" filter="url(#ga78bfa8)"/>
<text x="1166.8000000000002" y="807.92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#a78bfa" font-weight="800" text-anchor="middle" letter-spacing="0.5">Adopt</text>
<rect x="1227.2" y="779.0" width="149.6" height="42" rx="21.0" fill="rgba(148,163,184,0.14)" stroke="#94a3b8" stroke-width="2.5" filter="url(#g94a3b88)"/>
<text x="1302.0" y="807.92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8" font-weight="800" text-anchor="middle" letter-spacing="0.5">Whitelist</text>
<rect x="1490.8" y="779.0" width="123.19999999999999" height="42" rx="21.0" fill="rgba(52,211,153,0.14)" stroke="#34d399" stroke-width="2.5" filter="url(#g34d3998)"/>
<text x="1552.3999999999999" y="807.92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#34d399" font-weight="800" text-anchor="middle" letter-spacing="0.5">MATCHED</text>
<rect x="1626.0" y="779.0" width="123.19999999999999" height="42" rx="21.0" fill="rgba(52,211,153,0.14)" stroke="#34d399" stroke-width="2.5" filter="url(#g34d3998)"/>
<text x="1687.6" y="807.92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#34d399" font-weight="800" text-anchor="middle" letter-spacing="0.5">IN SYNC</text>
</svg>
