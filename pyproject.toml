[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DriftWarden"
version = "0.1.0"
description = "A bidirectional GitOps state reconciliation daemon for standalone Docker hosts."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Noor Al-deen Al-anati", email = "noor.anati@outlook.com" },
    { name = "Naeam Jaber", email = "Naeamjaber5@gmail.com" }
]
dependencies = [
    # Core Control Plane (FastAPI Web Server)
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "jinja2>=3.1.2",
    
    # Core Engine (Systems & Infrastructure)
    "docker>=7.0.0",
    "PyGithub>=2.1.0",
    "ruamel.yaml>=0.18.0",
    
    # Shared Data Boundary & State
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    
    # Utilities
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    # CI & Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.1",
    
    # Linting & Formatting
    "ruff>=0.1.0",
    "mypy>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shared*", "warden*", "web*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"